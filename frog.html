<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>青蛙捏捏乐</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#F7F1E5;
    display:flex;align-items:center;justify-content:center;
    -webkit-tap-highlight-color:transparent;}
  svg#frog{width:min(92vw,92vh);height:auto;display:block;cursor:pointer;
    touch-action:manipulation;}
  #face{transition:transform .5s cubic-bezier(.34,1.6,.5,1);
    transform-origin:200px 268px;}
  .press #face{transform:scale(1.07,0.93);transition:transform .12s ease-out;}
</style>
</head>
<body>
<svg id="frog" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 虚线菱形网格背景 -->
    <pattern id="dia" width="46" height="46" patternUnits="userSpaceOnUse"
             patternTransform="rotate(45)">
      <rect x="0.5" y="0.5" width="45" height="45" fill="none"
            stroke="#C6D0B4" stroke-width="1.8" stroke-dasharray="5 5"/>
    </pattern>
  </defs>

  <rect width="400" height="400" fill="url(#dia)"/>

  <!-- 腿：无描边，被身体盖住连接处 -->
  <g fill="#7A8B64">
    <ellipse cx="118" cy="302" rx="44" ry="31"/>
    <ellipse cx="282" cy="302" rx="44" ry="31"/>
    <ellipse cx="126" cy="326" rx="27" ry="17"/>
    <ellipse cx="274" cy="326" rx="27" ry="17"/>
  </g>

  <g id="face">
    <!-- 身体 -->
    <ellipse cx="200" cy="258" rx="106" ry="86" fill="#C6D0B4"/>

    <!-- 肚皮 -->
    <ellipse cx="200" cy="286" rx="62" ry="44" fill="#F7F1E5"/>

    <!-- 眼睛：圆形眼窝，与肤色一致，无描边；眼珠竖椭圆 -->
    <circle cx="152" cy="172" r="38" fill="#C6D0B4"/>
    <circle cx="248" cy="172" r="38" fill="#C6D0B4"/>
    <ellipse id="eyeL" cx="152" cy="174" rx="14" ry="19" fill="#3B352F"/>
    <ellipse id="eyeR" cx="248" cy="174" rx="14" ry="19" fill="#3B352F"/>

    <!-- 眯眼 ^ ^ -->
    <path id="squintL" d="M132 178 L152 158 L172 178" stroke="#3B352F"
          stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="squintR" d="M228 178 L248 158 L268 178" stroke="#3B352F"
          stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 嘴巴：V 字形 -->
    <path d="M170 236 L200 260 L230 236" stroke="#F7939F" stroke-width="6"
          fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 腮红 -->
    <circle cx="130" cy="230" r="15" fill="#FFC5BB" opacity="0.75"/>
    <circle cx="270" cy="230" r="15" fill="#FFC5BB" opacity="0.75"/>
  </g>
</svg>

<script>
  var svg    = document.getElementById('frog');
  var eyeL   = document.getElementById('eyeL'),  eyeR = document.getElementById('eyeR');
  var sqL    = document.getElementById('squintL'), sqR = document.getElementById('squintR');
  var timer  = null, pressT = null;

  sqL.style.opacity = 0;
  sqR.style.opacity = 0;

  function squint(on){
    eyeL.style.opacity = on ? 0 : 1;
    eyeR.style.opacity = on ? 0 : 1;
    sqL.style.opacity  = on ? 1 : 0;
    sqR.style.opacity  = on ? 1 : 0;
  }

  var ac = null;
  function audio(){
    if(!ac){
      var C = window.AudioContext || window.webkitAudioContext;
      if(!C) return null;
      ac = new C();
    }
    if(ac.state === 'suspended') ac.resume();
    return ac;
  }

  /* 呱呱 */
  function croak(){
    var a = audio();
    if(!a) return;
    var t = a.currentTime;
    [0, 0.15].forEach(function(off, i){
      var o = a.createOscillator(), g = a.createGain(), f = a.createBiquadFilter();
      f.type = 'bandpass'; f.frequency.value = 880; f.Q.value = 2.4;
      o.type = 'sawtooth';
      var s = t + off;
      o.frequency.setValueAtTime(i ? 300 : 340, s);
      o.frequency.exponentialRampToValueAtTime(150, s + 0.11);
      g.gain.setValueAtTime(0.0001, s);
      g.gain.exponentialRampToValueAtTime(0.26, s + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, s + 0.12);
      o.connect(f); f.connect(g); g.connect(a.destination);
      o.start(s); o.stop(s + 0.14);
    });
  }

  function pinch(){
    svg.classList.add('press');
    squint(true);
    croak();
    clearTimeout(timer);
    clearTimeout(pressT);
    pressT = setTimeout(function(){ svg.classList.remove('press'); }, 170);
    timer  = setTimeout(function(){
      svg.classList.remove('press');
      squint(false);
    }, 950);
  }

  svg.addEventListener('pointerdown', pinch);
  svg.setAttribute('tabindex','0');
  svg.addEventListener('keydown', function(e){
    if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); pinch(); }
  });
</script>
</body>
</html>
