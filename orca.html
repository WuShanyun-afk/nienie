<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>虎鲸捏捏乐</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#8FD3EC;
    display:flex;align-items:center;justify-content:center;
    -webkit-tap-highlight-color:transparent;}
  #bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;}
  svg#orcaSvg{position:relative;z-index:1;width:min(92vw,92vh);height:auto;display:block;
    cursor:pointer;touch-action:manipulation;}
  .eyeOpen,.eyeShut,.mouthNormal,.mouthPinch{transition:opacity .14s ease;}
  .eyeShut,.mouthPinch{opacity:0;}
  #orca{transform-box:view-box;transform-origin:200px 310px;
    transition:transform .5s cubic-bezier(.34,1.6,.5,1);}
  #finL,#finR{transform-box:view-box;
    transition:transform .45s cubic-bezier(.34,1.6,.5,1);}
  #finL{transform-origin:70px 282px;}
  #finR{transform-origin:330px 282px;}
  .squint .eyeOpen{opacity:0;}
  .squint .eyeShut{opacity:1;}
  .squint .mouthNormal{opacity:0;}
  .squint .mouthPinch{opacity:1;}
  .press #orca{transform:scale(1.08,0.92);transition:transform .12s ease-out;}
  .press #finL{transform:rotate(-9deg);transition:transform .12s ease-out;}
  .press #finR{transform:rotate(9deg);transition:transform .12s ease-out;}
  .heart{opacity:0;transform-box:fill-box;transform-origin:center;
    animation:pop 1.05s ease-out forwards;}
  @keyframes pop{
    0%  {opacity:0; transform:translateY(0) scale(.2);}
    18% {opacity:1; transform:translateY(-18px) scale(1.1);}
    100%{opacity:0; transform:translateY(-120px) scale(.75);}
  }
</style>
</head>
<body>

<!-- 背景：海洋世界的卡通画 -->
<svg id="bg" preserveAspectRatio="none" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#EAF9FE"/>
      <stop offset="28%"  stop-color="#C6EBF9"/>
      <stop offset="64%"  stop-color="#94D6EE"/>
      <stop offset="100%" stop-color="#61BBDF"/>
    </linearGradient>
    <linearGradient id="sandGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FCEBCB"/>
      <stop offset="100%" stop-color="#EED0A0"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" fill="url(#sea)"/>

  <!-- 阳光柱 -->
  <g fill="#FFFFFF" opacity=".32">
    <polygon points="9,-2 18,-2 32,64 20,64"/>
    <polygon points="40,-2 47,-2 55,56 44,56"/>
    <polygon points="65,-2 74,-2 84,62 71,62"/>
  </g>

  <!-- 海草 -->
  <g fill="none" stroke="#63C2A4" stroke-width="1.5" stroke-linecap="round" opacity=".9">
    <path d="M5 98 C3 89 8 85 5 77 C3 71 7 67 5 60"/>
    <path d="M8.6 98 C7 90 12 87 9 80 C7 75 11 71 9 64"/>
    <path d="M95 98 C97 89 92 85 95 77 C97 71 93 67 95 60"/>
    <path d="M91.4 98 C93 90 88 87 91 80 C93 75 89 71 91 64"/>
  </g>
  <g fill="none" stroke="#4FB894" stroke-width="1.4" stroke-linecap="round" opacity=".8">
    <path d="M14 98 C12 92 16 88 14 82"/>
    <path d="M86 98 C88 92 84 88 86 82"/>
  </g>

  <!-- 珊瑚 -->
  <g fill="none" stroke="#F7A8B8" stroke-width="2.6" stroke-linecap="round">
    <path d="M18 98 L18 88"/>
    <path d="M22 98 L22 82"/>
    <path d="M26 98 L26 79"/>
    <path d="M30 98 L30 86"/>
  </g>
  <g fill="none" stroke="#F6B98C" stroke-width="2.4" stroke-linecap="round">
    <path d="M70 98 L70 87"/>
    <path d="M74 98 L74 80"/>
    <path d="M78 98 L78 88"/>
  </g>

  <!-- 沙地 -->
  <path d="M0 88 Q13 84 26 87 Q40 90 54 86 Q70 82 86 87 Q94 89 100 87 L100 100 L0 100 Z"
        fill="url(#sandGrad)"/>
  <path d="M0 88 Q13 84 26 87 Q40 90 54 86 Q70 82 86 87 Q94 89 100 87"
        fill="none" stroke="#E3C593" stroke-width=".7"/>
</svg>

<!-- 虎鲸 -->
<svg id="orcaSvg" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="bodyClip">
      <path d="M200 78 C292 78 336 138 336 208 C336 276 276 316 200 316 C124 316 64 276 64 208 C64 138 108 78 200 78 Z"/>
    </clipPath>
  </defs>

  <!-- 水里的泡泡 -->
  <g fill="none" stroke="#FFFFFF" stroke-width="3" opacity=".6">
    <circle cx="34" cy="148" r="7"/>
    <circle cx="48" cy="120" r="4.5"/>
    <circle cx="366" cy="166" r="6"/>
    <circle cx="352" cy="140" r="4"/>
    <circle cx="26" cy="318" r="5"/>
    <circle cx="374" cy="300" r="6"/>
    <circle cx="200" cy="372" r="5"/>
    <circle cx="170" cy="358" r="3.5"/>
    <circle cx="230" cy="364" r="4"/>
  </g>

  <!-- 两条小鱼 -->
  <g>
    <ellipse cx="46" cy="56" rx="13" ry="8" fill="#FFCBA8"/>
    <path d="M59 56 L72 47 L72 65 Z" fill="#FFCBA8"/>
    <circle cx="39" cy="53" r="2.2" fill="#4A4038"/>
  </g>
  <g>
    <ellipse cx="356" cy="88" rx="11" ry="7" fill="#FFE1A8"/>
    <path d="M345 88 L333 81 L333 95 Z" fill="#FFE1A8"/>
    <circle cx="361" cy="85" r="2" fill="#4A4038"/>
  </g>

  <g id="orca">
    <!-- 背鳍 -->
    <path d="M166 110 C168 60 180 28 200 12 C220 28 232 60 234 110 Z"
          fill="#3F4453" stroke="#23262F" stroke-width="11" stroke-linejoin="round"/>

    <!-- 侧鳍 -->
    <g id="finL">
      <ellipse cx="70" cy="282" rx="20" ry="36" transform="rotate(32 70 282)"
               fill="#3F4453" stroke="#23262F" stroke-width="11"/>
    </g>
    <g id="finR">
      <ellipse cx="330" cy="282" rx="20" ry="36" transform="rotate(-32 330 282)"
               fill="#3F4453" stroke="#23262F" stroke-width="11"/>
    </g>

    <!-- 身体 -->
    <path d="M200 78 C292 78 336 138 336 208 C336 276 276 316 200 316 C124 316 64 276 64 208 C64 138 108 78 200 78 Z"
          fill="#3F4453" stroke="#23262F" stroke-width="11"/>

    <!-- 白肚 -->
    <g clip-path="url(#bodyClip)">
      <ellipse cx="200" cy="292" rx="72" ry="50" fill="#FFFFFF"/>
    </g>

    <!-- 眼睛 -->
    <g class="eye">
      <g class="eyeOpen" fill="#FFFFFF">
        <ellipse cx="142" cy="178" rx="11" ry="9" transform="rotate(-12 142 178)"/>
        <ellipse cx="258" cy="178" rx="11" ry="9" transform="rotate(12 258 178)"/>
      </g>
      <g class="eyeShut" stroke="#FFFFFF" stroke-width="8" fill="none" stroke-linecap="round">
        <path d="M132 178 L152 176"/>
        <path d="M248 176 L268 178"/>
      </g>
    </g>

    <!-- 眼尾小圆 -->
    <g id="eyeDots" fill="#F2EDE0">
      <circle cx="120" cy="191" r="12"/>
      <circle cx="280" cy="191" r="12"/>
    </g>

    <!-- 腮红 -->
    <g id="blush" fill="#F8DFD3">
      <circle cx="142" cy="222" r="20"/>
      <circle cx="258" cy="222" r="20"/>
    </g>

    <!-- 猫嘴 -->
    <g class="mouth">
      <path class="mouthNormal" d="M178 198 Q189 215 200 203 Q211 215 222 198"
            fill="none" stroke="#FFFFFF" stroke-width="8"
            stroke-linecap="round" stroke-linejoin="round"/>
      <path class="mouthPinch" d="M180 199 Q190 218 200 205 Q210 218 220 199"
            fill="none" stroke="#FFFFFF" stroke-width="8"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <g id="hearts"></g>
</svg>

<script>
  var svg    = document.getElementById('orcaSvg');
  var layer  = document.getElementById('hearts');
  var timer  = null;
  var pressT = null;

  var ac = null;
  function audio(){
    if(!ac){
      var C = window.AudioContext || window.webkitAudioContext;
      if(!C) return null;
      ac = new C();
    }
    if(ac.state === 'suspended') ac.resume();
    return ac;
  }

  function whistle(){
    var a = audio();
    if(!a) return;
    var t = a.currentTime;

    function chirp(t0, f1, f2, dur, vol){
      var o = a.createOscillator();
      var g = a.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(f1, t0);
      o.frequency.exponentialRampToValueAtTime(f2, t0 + dur * 0.8);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(a.destination);
      o.start(t0); o.stop(t0 + dur + 0.02);
    }
    chirp(t, 720, 1180, 0.13, 0.22);
    chirp(t + 0.15, 560, 880, 0.18, 0.18);
  }

  var HEART = 'M0 6 C0 2 4 -1 7 2 C10 -1 14 2 14 6 C14 11 7 15 7 15 C7 15 0 11 0 6 Z';

  function heart(x, y, size, rot, delay){
    var outer = document.createElementNS('http://www.w3.org/2000/svg','g');
    outer.setAttribute('class','heart');
    outer.style.animationDelay = delay + 'ms';
    var inner = document.createElementNS('http://www.w3.org/2000/svg','g');
    inner.setAttribute('transform',
      'translate(' + x + ',' + y + ') rotate(' + rot + ') scale(' + size + ')');
    var p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d', HEART);
    p.setAttribute('fill', '#f8748b');
    p.setAttribute('transform','translate(-7,-7)');
    inner.appendChild(p);
    outer.appendChild(inner);
    layer.appendChild(outer);
    setTimeout(function(){ outer.remove(); }, 1300 + delay);
  }

  function burst(){
    var spots = [
      [130, 234, 1.9, -14, 0],
      [270, 234, 1.9,  14, 0],
      [200, 216, 1.5,   0, 90],
      [ 92, 292, 1.2, -22, 170],
      [308, 292, 1.2,  22, 170]
    ];
    for(var i = 0; i < spots.length; i++){
      heart(spots[i][0], spots[i][1], spots[i][2], spots[i][3], spots[i][4]);
    }
  }

  function pinch(){
    svg.classList.add('squint','press');
    burst();
    whistle();
    clearTimeout(timer);
    clearTimeout(pressT);
    pressT = setTimeout(function(){ svg.classList.remove('press'); }, 170);
    timer  = setTimeout(function(){ svg.classList.remove('squint'); }, 950);
  }

  svg.addEventListener('pointerdown', pinch);
  svg.setAttribute('tabindex','0');
  svg.addEventListener('keydown', function(e){
    if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); pinch(); }
  });
</script>
</body>
</html>
