<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>薄荷奶绿</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e6f2e2;
    display:flex;align-items:center;justify-content:center;
    -webkit-tap-highlight-color:transparent;}
  svg#cat{width:min(92vw,92vh);height:auto;display:block;cursor:pointer;
    touch-action:manipulation;}
  #face{transition:transform .5s cubic-bezier(.34,1.6,.5,1);
    transform-origin:200px 300px;}
  .press #face{transform:scale(1.07,0.93);transition:transform .12s ease-out;}
  .heart{opacity:0;transform-origin:center;animation:pop 1.05s ease-out forwards;}
  @keyframes pop{
    0%  {opacity:0; transform:translateY(0) scale(.2);}
    18% {opacity:1; transform:translateY(-18px) scale(1.1);}
    100%{opacity:0; transform:translateY(-120px) scale(.75);}
  }
</style>
</head>
<body>
<svg id="cat" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="faceGrad" cx="42%" cy="30%" r="76%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="72%" stop-color="#fbfdfa"/>
      <stop offset="100%" stop-color="#eef5ea"/>
    </radialGradient>
    <linearGradient id="whiskL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#9db894" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#9db894" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="whiskR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%"  stop-color="#9db894" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#9db894" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 耳朵：钝三角，尖角圆润，位于头两侧 -->
  <g id="ears" fill="#f6faf3">
    <path d="M102.3 100 L75.7 160 Q66 182 89.8 179 L152.2 171
             Q176 168 162.1 148.4 L125.9 97.6 Q112 78 102.3 100 Z"/>
    <path d="M297.7 100 L324.3 160 Q334 182 310.2 179 L247.8 171
             Q224 168 237.9 148.4 L274.1 97.6 Q288 78 297.7 100 Z"/>
  </g>

  <!-- 脸：短圆 -->
  <g id="face">
    <ellipse cx="200" cy="252" rx="186" ry="128" fill="url(#faceGrad)"/>
  </g>

  <!-- 眼睛：睁眼，圆点 -->
  <g fill="#cfa88c">
    <ellipse cx="122" cy="230" rx="17" ry="19"/>
    <ellipse cx="278" cy="230" rx="17" ry="19"/>
  </g>

  <!-- 嘴：浅棕，无鼻子 -->
  <path d="M172 264 q14 16 28 0 q14 16 28 0"
        fill="none" stroke="#cfa88c" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 胡须：六根，浅灰色，脸颊两侧，最上一根与嘴平行，间距近 -->
  <g stroke="#ffb6bd" stroke-width="4" stroke-linecap="round">
    <line x1="42"  y1="268" x2="158" y2="268"/>
    <line x1="42"  y1="283" x2="158" y2="283"/>
    <line x1="42"  y1="298" x2="158" y2="298"/>
    <line x1="358" y1="268" x2="242" y2="268"/>
    <line x1="358" y1="283" x2="242" y2="283"/>
    <line x1="358" y1="298" x2="242" y2="298"/>
  </g>

  <g id="hearts"></g>
</svg>

<script>
  var svg    = document.getElementById('cat');
  var layer  = document.getElementById('hearts');
  var timer  = null;
  var pressT = null;

  var ac = null;
  function audio(){
    if(!ac){
      var C = window.AudioContext || window.webkitAudioContext;
      if(!C) return null;
      ac = new C();
    }
    if(ac.state === 'suspended') ac.resume();
    return ac;
  }

  function squeak(){
    var a = audio();
    if(!a) return;
    var t = a.currentTime;

    var osc = a.createOscillator();
    var gain = a.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(820, t);
    osc.frequency.exponentialRampToValueAtTime(1680, t + 0.07);
    osc.frequency.exponentialRampToValueAtTime(1120, t + 0.16);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.22, t + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    osc.connect(gain); gain.connect(a.destination);
    osc.start(t); osc.stop(t + 0.2);

    var osc2 = a.createOscillator();
    var g2 = a.createGain();
    osc2.type = 'triangle';
    osc2.frequency.setValueAtTime(1660, t);
    osc2.frequency.exponentialRampToValueAtTime(2320, t + 0.12);
    g2.gain.setValueAtTime(0.0001, t);
    g2.gain.exponentialRampToValueAtTime(0.07, t + 0.01);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
    osc2.connect(g2); g2.connect(a.destination);
    osc2.start(t); osc2.stop(t + 0.16);
  }

  var HEART = 'M0 6 C0 2 4 -1 7 2 C10 -1 14 2 14 6 C14 11 7 15 7 15 C7 15 0 11 0 6 Z';

  function heart(x, y, size, rot, delay){
    var g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','heart');
    g.setAttribute('transform',
      'translate(' + x + ',' + y + ') rotate(' + rot + ') scale(' + size + ')');
    g.style.animationDelay = delay + 'ms';
    var p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d', HEART);
    p.setAttribute('fill', '#f8748b');
    p.setAttribute('transform','translate(-7,-7)');
    g.appendChild(p);
    layer.appendChild(g);
    setTimeout(function(){ g.remove(); }, 1300 + delay);
  }

  function burst(){
    var spots = [
      [104, 268, 1.9, -14, 0],
      [296, 268, 1.9,  14, 0],
      [200, 258, 1.5,   0, 90],
      [96,  328, 1.2, -22, 170],
      [304, 328, 1.2,  22, 170]
    ];
    for(var i = 0; i < spots.length; i++){
      heart(spots[i][0], spots[i][1], spots[i][2], spots[i][3], spots[i][4]);
    }
  }

  function pinch(){
    svg.classList.add('press');
    burst();
    squeak();
    clearTimeout(timer);
    clearTimeout(pressT);
    pressT = setTimeout(function(){ svg.classList.remove('press'); }, 170);
    timer  = setTimeout(function(){ svg.classList.remove('press'); }, 950);
  }

  svg.addEventListener('pointerdown', pinch);
  svg.setAttribute('tabindex','0');
  svg.addEventListener('keydown', function(e){
    if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); pinch(); }
  });
</script>
</body>
</html>
