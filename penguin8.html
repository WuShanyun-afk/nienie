<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>捏捏乐企鹅</title>
<style>
  html,body{margin:0;height:100%;background:#FFFDF7;display:flex;align-items:center;justify-content:center;
    overflow:hidden;-webkit-tap-highlight-color:transparent;font-family:system-ui,sans-serif;}
  #stage{position:relative;width:min(90vw,90vh);aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;}
  #penguin{width:100%;height:100%;cursor:pointer;touch-action:manipulation;display:block;
    transform-origin:50% 88%;}
  .emoji{position:absolute;font-size:9vmin;pointer-events:none;animation:float 1.1s ease-out forwards;}
  @keyframes float{
    0%{opacity:0;transform:translateY(0) scale(.5);}
    20%{opacity:1;transform:translateY(-6%) scale(1.1);}
    100%{opacity:0;transform:translateY(-70%) scale(1);}
  }
  #hint{position:fixed;bottom:3vh;width:100%;text-align:center;color:#B0A79A;font-size:14px;}
</style>
</head>
<body>
<div id="stage">
  <svg id="penguin" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
    <g id="body" fill="none" stroke="#8A6A4F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M200 84 C120 84 78 160 78 232 C78 306 130 348 200 348 C270 348 322 306 322 232 C322 160 280 84 200 84 Z" fill="#B9CFE8"/>
      <path d="M200 218 C160 218 138 258 138 296 C138 328 164 348 200 348 C236 348 262 328 262 296 C262 258 240 218 200 218 Z" fill="#FFFDF7"/>
      <path d="M126 240 C134 252 130 266 118 270"/>
      <path d="M274 240 C266 252 270 266 282 270"/>
      <ellipse cx="200" cy="186" rx="34" ry="22" fill="#FBF0A8"/>
      <path d="M168 184 L200 196 L232 184"/>
      <path d="M186 352 L176 370 L168 352 L158 370 L150 352" fill="#FBF0A8"/>
      <path d="M214 352 L224 370 L232 352 L242 370 L250 352" fill="#FBF0A8"/>
    </g>
    <g id="eyesOpen">
      <circle cx="152" cy="164" r="11" fill="#8A6A4F"/>
      <circle cx="248" cy="164" r="11" fill="#8A6A4F"/>
    </g>
    <g id="eyesClosed" style="display:none">
      <path d="M141 164 Q152 174 163 164" fill="none" stroke="#8A6A4F" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M237 164 Q248 174 259 164" fill="none" stroke="#8A6A4F" stroke-width="4.5" stroke-linecap="round"/>
    </g>
  </svg>
</div>
<div id="hint">点一下试试</div>
<script>
const AC = window.AudioContext || window.webkitAudioContext;
let ctx = null;
function audio(){
  if(!ctx) ctx = new AC();
  if(ctx.state === 'suspended') ctx.resume();
  return ctx;
}
function heng(){
  const c = audio(), t = c.currentTime;
  const o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
  o.type = 'triangle';
  o.frequency.setValueAtTime(300, t);
  o.frequency.exponentialRampToValueAtTime(150, t + 0.22);
  f.type = 'lowpass';
  f.frequency.value = 900;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.22, t + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
  o.connect(f); f.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + 0.32);
}

const p = document.getElementById('penguin');
const stage = document.getElementById('stage');
const open = document.getElementById('eyesOpen');
const shut = document.getElementById('eyesClosed');

const CX = 200, CY = 352;   // 缩放锚点：脚底，全身一起弹
const DUR = 460;            // 一次回弹时长

let t0 = 0, raf = null, eyeTimer = null;

// 0~1 的进度算形变，可被下一次点击随时打断重算
function deform(k){
  const s = Math.sin(Math.PI * k);        // 0 → 1 → 0
  const sx = 1 + 0.11 * s;                // 横向变胖
  const sy = 1 - 0.13 * s;                // 纵向压矮
  const dx = (1 - sx) * CX;
  const dy = (1 - sy) * CY;
  p.setAttribute('transform',
    'translate(' + dx.toFixed(2) + ' ' + dy.toFixed(2) + ') scale(' + sx.toFixed(4) + ' ' + sy.toFixed(4) + ')');
}

function frame(now){
  if(!t0) t0 = now;
  const k = Math.min((now - t0) / DUR, 1);
  deform(k);
  if(k < 1){ raf = requestAnimationFrame(frame); }
  else { raf = null; t0 = 0; deform(0); }
}

function pop(){
  t0 = 0;                                  // 重新计时，不用等上一次结束
  if(raf) cancelAnimationFrame(raf);
  raf = requestAnimationFrame(frame);

  heng();

  open.style.display = 'none';
  shut.style.display = '';
  clearTimeout(eyeTimer);
  eyeTimer = setTimeout(function(){
    open.style.display = '';
    shut.style.display = 'none';
  }, 420);

  const e = document.createElement('div');
  e.className = 'emoji';
  e.textContent = '🐧';
  e.style.left = (42 + Math.random() * 16) + '%';
  e.style.top  = (30 + Math.random() * 12) + '%';
  stage.appendChild(e);
  setTimeout(function(){ e.remove(); }, 1150);
}

p.addEventListener('pointerdown', pop);
</script>
</body>
</html>
