<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>小鸡厨师</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#d7e8e8;
    -webkit-tap-highlight-color:transparent;user-select:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  svg{width:min(92vw,92vh);height:min(92vw,92vh);display:block;cursor:pointer;}
  .bubble{position:fixed;left:50%;top:16%;transform:translateX(-50%) scale(0.6);
    background:#fff;border:4px solid #5C2A1E;border-radius:22px;padding:10px 20px;
    font-family:system-ui,-apple-system,sans-serif;font-size:26px;color:#5C2A1E;
    opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;white-space:nowrap;}
  .bubble.on{opacity:1;transform:translateX(-50%) scale(1);}
  .emoji{position:fixed;font-size:34px;pointer-events:none;opacity:1;
    transition:transform 1.1s ease-out,opacity 1.1s ease-out;}
</style>
</head>
<body>
<div id="wrap">
<svg id="chick" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots" x="0" y="0" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="23" cy="23" r="6.5" fill="#FFFFFF" opacity="0.9"/>
    </pattern>
  </defs>

  <rect width="400" height="400" fill="#FBEFA8"/>
  <rect width="400" height="400" fill="url(#dots)"/>

  <!-- knife (left) -->
  <g id="knife" transform="translate(58,244) rotate(-36)">
    <rect x="-5" y="-10" width="10" height="86" rx="5" fill="#FFFFFF" stroke="#5C2A1E" stroke-width="8.5" stroke-linejoin="round"/>
    <path d="M-13,-70 L13,-70 L13,-16 Q0,-8 -13,-16 Z"
          fill="#FFFFFF" stroke="#5C2A1E" stroke-width="8.5" stroke-linejoin="round"/>
  </g>

  <!-- fork (right) -->
  <g id="fork" transform="translate(342,244) rotate(36)">
    <rect x="-5" y="-10" width="10" height="86" rx="5" fill="#FFFFFF" stroke="#5C2A1E" stroke-width="8.5" stroke-linejoin="round"/>
    <path d="M-24,-64 L-24,-16 Q-24,-6 -14,-6 L14,-6 Q24,-6 24,-16 L24,-64 Z"
          fill="#FFFFFF" stroke="#5C2A1E" stroke-width="8.5" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="-12" y1="-64" x2="-12" y2="-10" stroke="#5C2A1E" stroke-width="8.5" stroke-linecap="round"/>
    <line x1="12" y1="-64" x2="12" y2="-10" stroke="#5C2A1E" stroke-width="8.5" stroke-linecap="round"/>
  </g>

  <!-- feet -->
  <g stroke="#5C2A1E" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M180,306 L180,320 M180,320 L169,331 M180,320 L180,333 M180,320 L191,331"/>
    <path d="M220,306 L220,320 M220,320 L209,331 M220,320 L220,333 M220,320 L231,331"/>
  </g>

  <!-- wings -->
  <path id="wingL" d="M100,220 Q70,232 76,268 Q88,296 122,282 Q134,254 124,226 Z"
        fill="#FFE23D" stroke="#5C2A1E" stroke-width="9" stroke-linejoin="round"/>
  <path id="wingR" d="M300,220 Q330,232 324,268 Q312,296 278,282 Q266,254 276,226 Z"
        fill="#FFE23D" stroke="#5C2A1E" stroke-width="9" stroke-linejoin="round"/>

  <!-- body group (squash + jump) -->
  <g id="bodyG">
    <ellipse cx="200" cy="222" rx="110" ry="94" fill="#FFE23D" stroke="#5C2A1E" stroke-width="10"/>

    <!-- chef hat -->
    <g id="hat" transform="translate(200,98)">
      <path d="M-62,26 Q-84,26 -84,2 Q-84,-22 -62,-24 Q-60,-52 -30,-54 Q-18,-74 6,-64 Q30,-74 42,-54 Q72,-52 74,-24 Q96,-22 96,2 Q96,26 74,26 Z"
            fill="#FFFFFF" stroke="#5C2A1E" stroke-width="9" stroke-linejoin="round"/>
      <rect x="-62" y="16" width="124" height="26" rx="8" fill="#FFFFFF" stroke="#5C2A1E" stroke-width="9"/>
      <line x1="-22" y1="-34" x2="-14" y2="-12" stroke="#5C2A1E" stroke-width="8" stroke-linecap="round"/>
      <line x1="14" y1="-34" x2="22" y2="-12" stroke="#5C2A1E" stroke-width="8" stroke-linecap="round"/>
    </g>

    <!-- blush -->
    <ellipse cx="142" cy="234" rx="18" ry="17" fill="#FBD6E4"/>
    <ellipse cx="258" cy="234" rx="18" ry="17" fill="#FBD6E4"/>

    <!-- eyes open (hidden by default) -->
    <g id="eyesOpen" style="display:none">
      <ellipse cx="158" cy="204" rx="9" ry="12" fill="#5C2A1E"/>
      <ellipse cx="242" cy="204" rx="9" ry="12" fill="#5C2A1E"/>
    </g>
    <!-- eyes closed -->
    <g id="eyesClosed">
      <ellipse cx="158" cy="204" rx="12" ry="4.6" fill="#5C2A1E"/>
      <ellipse cx="242" cy="204" rx="12" ry="4.6" fill="#5C2A1E"/>
    </g>

    <!-- eyebrows -->
    <ellipse cx="188" cy="184" rx="4.2" ry="3.2" fill="#5C2A1E"/>
    <ellipse cx="212" cy="184" rx="4.2" ry="3.2" fill="#5C2A1E"/>

    <!-- beak -->
    <ellipse cx="200" cy="228" rx="18" ry="14" fill="#F5A623" stroke="#5C2A1E" stroke-width="5"/>
    <ellipse cx="200" cy="218" rx="18" ry="10" fill="#F5A623" stroke="#5C2A1E" stroke-width="5"/>
    <ellipse cx="193" cy="216" rx="3" ry="3.8" fill="#5C2A1E"/>
    <ellipse cx="207" cy="216" rx="3" ry="3.8" fill="#5C2A1E"/>
  </g>
</svg>
</div>
<div class="bubble" id="bubble">(๑•̀ㅂ•́)و✧ 咕咕</div>
<script>
(function(){
  var svg = document.getElementById('chick');
  var bodyG = document.getElementById('bodyG');
  var wingL = document.getElementById('wingL');
  var wingR = document.getElementById('wingR');
  var hat = document.getElementById('hat');
  var knife = document.getElementById('knife');
  var fork = document.getElementById('fork');
  var eyesOpen = document.getElementById('eyesOpen');
  var eyesClosed = document.getElementById('eyesClosed');
  var bubble = document.getElementById('bubble');

  var raf = null, t0 = 0;

  // ---- WebAudio 咕咕叫 ----
  var actx = null;
  function ensureAudio(){
    if(!actx){
      try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
    }
    if(actx && actx.state === 'suspended'){ actx.resume(); }
  }
  function coo(){
    ensureAudio();
    if(!actx) return;
    var t = actx.currentTime;
    var o = actx.createOscillator();
    var g = actx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(760, t);
    o.frequency.exponentialRampToValueAtTime(430, t + 0.16);
    o.frequency.exponentialRampToValueAtTime(600, t + 0.30);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.16, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + 0.36);
  }

  // ---- 飘 emoji ----
  function flyEmoji(){
    var e = document.createElement('div');
    e.className = 'emoji';
    e.textContent = '🥰';
    var x = window.innerWidth/2 + (Math.random()*120 - 60);
    var y = window.innerHeight*0.42;
    e.style.left = x + 'px';
    e.style.top = y + 'px';
    document.body.appendChild(e);
    void e.offsetWidth;
    requestAnimationFrame(function(){
      e.style.transform = 'translateY(-140px) scale(1.5)';
      e.style.opacity = '0';
    });
    setTimeout(function(){ e.remove(); }, 1200);
  }

  function showBubble(){
    bubble.classList.add('on');
    clearTimeout(bubble._t);
    bubble._t = setTimeout(function(){ bubble.classList.remove('on'); }, 900);
  }

  // ---- 动画 ----
  function reset(){
    bodyG.setAttribute('transform','');
    wingL.setAttribute('transform','');
    wingR.setAttribute('transform','');
    hat.setAttribute('transform','translate(200,98)');
    knife.setAttribute('transform','translate(58,244) rotate(-36)');
    fork.setAttribute('transform','translate(342,244) rotate(36)');
    eyesOpen.style.display = 'none';
    eyesClosed.style.display = '';
  }

  function play(){
    if(raf){ cancelAnimationFrame(raf); }
    t0 = 0;

    eyesClosed.style.display = 'none';
    eyesOpen.style.display = '';
    coo();
    showBubble();
    flyEmoji();

    var DUR = 460;

    function frame(now){
      if(!t0){ t0 = now; }
      var k = (now - t0) / DUR;
      if(k >= 1){
        reset();
        raf = null;
        return;
      }
      var s = Math.sin(Math.PI * k);      // 0 -> 1 -> 0
      var jump = -46 * s;
      var sx = 1 + 0.16 * s;
      var sy = 1 - 0.10 * s;

      // 身体：横向变胖 + 上跳（锚点底部）
      bodyG.setAttribute('transform',
        'translate(200,316) scale(' + sx + ',' + sy + ') translate(-200,-316) translate(0,' + jump + ')');

      // 翅膀扇动 3 次
      var flap = Math.sin(k * Math.PI * 6) * 22 * s;
      wingL.setAttribute('transform','rotate(' + (-flap) + ' 110 250)');
      wingR.setAttribute('transform','rotate(' + (flap) + ' 290 250)');

      // 帽子晃
      hat.setAttribute('transform','translate(200,98) rotate(' + (s*7) + ')');

      // 刀叉抖
      knife.setAttribute('transform','translate(58,244) rotate(' + (-36 + s*10) + ')');
      fork.setAttribute('transform','translate(342,244) rotate(' + (36 - s*10) + ')');

      raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
  }

  svg.addEventListener('pointerdown', function(e){
    e.preventDefault();
    ensureAudio();
    play();
  }, {passive:false});

  // 首次触摸解锁音频
  document.addEventListener('touchstart', ensureAudio, {once:true, passive:true});
})();
</script>
</body>
</html>
